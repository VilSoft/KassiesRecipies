version: "3.8"

services:
  kassiesrecipies:
    build: ./  # if building locally
    # image: ghcr.io/<your-username>/kassiesrecipies:latest  # for CI/CD
    container_name: kassiesrecipies
    restart: unless-stopped
    network_mode: host
    # The app defaults to mongodb://localhost:27017/recipies. Uncomment to override.
    # environment:
    #   RECIPES_MONGO_URI: mongodb://localhost:27017/recipies
    volumes:
      - /home/kai/KassiesRecipies/uploads:/app/uploads
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 5
